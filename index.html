<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>แปลง PNG เป็น STL</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap">
<style>
:root{--bg:#e8ecef;--panel:#fff;--ink:#12202c;--mut:#5d6b77;--line:#cfd7dd;--acc:#1f4fe0;--accink:#fff;--view:#d5dde3;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--panel:#18222b;--ink:#e6edf2;--mut:#93a1ad;--line:#2b3946;--acc:#6b93ff;--accink:#0b1220;--view:#0c1218;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10171d;--panel:#18222b;--ink:#e6edf2;--mut:#93a1ad;--line:#2b3946;--acc:#6b93ff;--accink:#0b1220;--view:#0c1218;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.6 "Noto Sans Thai",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:28px;line-height:1.3;margin:0 0 4px;font-weight:700}
.sub{margin:0 0 20px;color:var(--mut);max-width:60ch}
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.drop{display:block;border:2px dashed var(--line);border-radius:8px;padding:22px 12px;text-align:center;cursor:pointer;color:var(--mut)}
.drop:hover,.drop:focus-within{border-color:var(--acc);color:var(--ink)}
.drop input{position:absolute;opacity:0;width:1px;height:1px}
.drop b{display:block;color:var(--ink);font-weight:600}
.row{margin-top:16px}
.row label{display:flex;justify-content:space-between;font-weight:600;font-size:14px}
.row output{font-weight:400;color:var(--mut)}
input[type=range]{width:100%;accent-color:var(--acc)}
.chk{display:flex;gap:8px;align-items:center;margin-top:16px;font-size:14px}
.hint{font-size:13px;color:var(--mut);margin:4px 0 0}
button{font:inherit;cursor:pointer;border-radius:8px;padding:10px 14px;border:1px solid var(--line);background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible+span{outline:2px solid var(--acc);outline-offset:2px}
button.main{background:var(--acc);color:var(--accink);border-color:var(--acc);font-weight:600;width:100%;margin-top:18px}
button.main:disabled{opacity:.45;cursor:not-allowed}
button.ghost{width:100%;margin-top:10px}
#view{position:relative;height:420px;border-radius:10px;background:var(--view);border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:grab}
#view:active{cursor:grabbing}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--mut);pointer-events:none}
#stat{margin:10px 2px 0;color:var(--mut);font-size:14px}
</style>
</head>
<body>
<main>
  <h1>แปลง PNG เป็น STL</h1>
  <p class="sub">อัปโหลดโลโก้หรือไอคอน แล้วดันรูปทรงขึ้นเป็นโมเดล 3 มิติสำหรับพิมพ์ ประมวลผลในเบราว์เซอร์ทั้งหมด ไฟล์ของคุณไม่ถูกส่งไปที่ไหน</p>
  <div class="grid">
    <section class="panel" aria-label="ตั้งค่า">
      <label class="drop">
        <input id="file" type="file" accept="image/png,image/*">
        <b>เลือกไฟล์ PNG</b>
        ภาพพื้นหลังโปร่งใสให้ผลดีที่สุด
      </label>
      <button id="demo" class="ghost" type="button">ลองกับรูปตัวอย่าง</button>

      <div class="row"><label for="wd">ความกว้างจริง <output id="wdo"></output></label>
        <input id="wd" type="range" min="10" max="200" value="60"></div>
      <div class="row"><label for="th">ความหนา <output id="tho"></output></label>
        <input id="th" type="range" min="1" max="30" step="0.5" value="4"></div>
      <div class="row"><label for="res">ความละเอียด <output id="reso"></output></label>
        <input id="res" type="range" min="40" max="250" step="10" value="120">
        <p class="hint">ยิ่งสูง ขอบยิ่งเนียน แต่ไฟล์ใหญ่ขึ้น</p></div>
      <div class="row" id="thrrow"><label for="thr">ค่าตัดความมืด <output id="thro"></output></label>
        <input id="thr" type="range" min="1" max="254" value="128">
        <p class="hint">ใช้กับภาพที่ไม่โปร่งใส: พิกเซลที่เข้มกว่าค่านี้จะกลายเป็นรูปทรง</p></div>
      <label class="chk"><input id="inv" type="checkbox"> กลับด้าน (เอาส่วนที่หายไปมาเป็นรูปทรง)</label>

      <button id="dl" class="main" type="button" disabled>ดาวน์โหลด STL</button>
    </section>

    <section>
      <div id="view" aria-label="ตัวอย่าง 3 มิติ ลากเพื่อหมุน เลื่อนล้อเมาส์เพื่อซูม">
        <div id="msg">เลือกไฟล์ PNG หรือลองรูปตัวอย่างเพื่อดูโมเดล</div>
      </div>
      <p id="stat"></p>
    </section>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const cv = document.createElement('canvas');
const cx = cv.getContext('2d', { willReadFrequently: true });
let img = null, P = null, N = null, fname = 'model';

/* ---------- 3D preview ---------- */
const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
view.prepend(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(40, 1, 0.1, 5000);
scene.add(new THREE.HemisphereLight(0xffffff, 0x778899, 0.9));
const dl = new THREE.DirectionalLight(0xffffff, 0.8);
dl.position.set(1, 1.5, 2);
scene.add(dl);
const group = new THREE.Group();
scene.add(group);
let dist = 100;

function render() { cam.position.set(0, 0, dist); renderer.render(scene, cam); }
function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  cam.aspect = w / h;
  cam.updateProjectionMatrix();
  render();
}
addEventListener('resize', resize);

let drag = null;
view.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; view.setPointerCapture(e.pointerId); });
view.addEventListener('pointerup', () => drag = null);
view.addEventListener('pointermove', e => {
  if (!drag) return;
  group.rotation.y += (e.clientX - drag[0]) * 0.01;
  group.rotation.x += (e.clientY - drag[1]) * 0.01;
  drag = [e.clientX, e.clientY];
  render();
});
view.addEventListener('wheel', e => {
  e.preventDefault();
  dist = Math.max(10, dist * (e.deltaY > 0 ? 1.08 : 0.92));
  render();
}, { passive: false });

/* ---------- mesh building ---------- */
function build() {
  if (!img) return;
  const res = +$('res').value, th = +$('th').value, wd = +$('wd').value,
        thr = +$('thr').value, inv = $('inv').checked;
  $('wdo').textContent = wd + ' มม.';
  $('tho').textContent = th + ' มม.';
  $('reso').textContent = res + ' px';
  $('thro').textContent = thr;

  const sc = res / Math.max(img.width, img.height);
  const W = Math.max(1, Math.round(img.width * sc)), H = Math.max(1, Math.round(img.height * sc));
  cv.width = W; cv.height = H;
  cx.clearRect(0, 0, W, H);
  cx.drawImage(img, 0, 0, W, H);
  const d = cx.getImageData(0, 0, W, H).data;

  let hasAlpha = false;
  for (let i = 3; i < d.length; i += 4) if (d[i] < 250) { hasAlpha = true; break; }
  $('thrrow').style.opacity = hasAlpha ? 0.4 : 1;

  const m = new Uint8Array(W * H);
  for (let k = 0; k < W * H; k++) {
    const a = d[k * 4 + 3];
    const on = hasAlpha ? a > 128
      : (0.299 * d[k * 4] + 0.587 * d[k * 4 + 1] + 0.114 * d[k * 4 + 2]) < thr;
    m[k] = (on !== inv) ? 1 : 0;
  }

  const s = wd / W, pos = [], nor = [];
  const q = (a, b, c, e, n) => {
    pos.push(...a, ...b, ...c, ...a, ...c, ...e);
    for (let t = 0; t < 6; t++) nor.push(...n);
  };
  const on = (i, j) => i >= 0 && j >= 0 && i < W && j < H && m[j * W + i];
  for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
    if (!m[j * W + i]) continue;
    const x0 = i * s, x1 = x0 + s, y1 = (H - j) * s, y0 = y1 - s, T = th;
    q([x0,y0,T],[x1,y0,T],[x1,y1,T],[x0,y1,T],[0,0,1]);
    q([x0,y0,0],[x0,y1,0],[x1,y1,0],[x1,y0,0],[0,0,-1]);
    if (!on(i+1, j)) q([x1,y0,0],[x1,y1,0],[x1,y1,T],[x1,y0,T],[1,0,0]);
    if (!on(i-1, j)) q([x0,y1,0],[x0,y0,0],[x0,y0,T],[x0,y1,T],[-1,0,0]);
    if (!on(i, j-1)) q([x1,y1,0],[x0,y1,0],[x0,y1,T],[x1,y1,T],[0,1,0]);
    if (!on(i, j+1)) q([x0,y0,0],[x1,y0,0],[x1,y0,T],[x0,y0,T],[0,-1,0]);
  }

  while (group.children.length) {
    const o = group.children.pop(); o.geometry.dispose(); o.material.dispose();
  }
  if (!pos.length) {
    P = null; $('dl').disabled = true;
    $('msg').style.display = 'flex';
    $('msg').textContent = 'ไม่พบรูปทรงในภาพ ลองปรับค่าตัดความมืดหรือกลับด้าน';
    $('stat').textContent = '';
    render(); return;
  }
  P = new Float32Array(pos); N = new Float32Array(nor);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(P, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(N, 3));
  g.translate(-wd / 2, -(H * s) / 2, -th / 2);
  group.add(new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: 0x4d7cff, roughness: 0.55, metalness: 0.05 })));
  dist = Math.max(wd, H * s) * 2.1;
  if (!build.shown) { group.rotation.set(-0.45, 0.5, 0); build.shown = true; }
  $('msg').style.display = 'none';
  $('dl').disabled = false;
  const tris = P.length / 9;
  $('stat').textContent = `ขนาดโมเดล ${wd} × ${(H * s).toFixed(1)} × ${th} มม. · ${tris.toLocaleString()} สามเหลี่ยม · ไฟล์ประมาณ ${((84 + 50 * tris) / 1048576).toFixed(1)} MB`;
  resize();
}

/* ---------- STL export (binary) ---------- */
function downloadSTL() {
  if (!P) return;
  const n = P.length / 9, buf = new ArrayBuffer(84 + 50 * n), dv = new DataView(buf);
  const head = 'png-to-stl';
  for (let i = 0; i < head.length; i++) dv.setUint8(i, head.charCodeAt(i));
  dv.setUint32(80, n, true);
  let o = 84;
  for (let t = 0; t < n; t++) {
    for (let k = 0; k < 3; k++) { dv.setFloat32(o, N[t * 9 + k], true); o += 4; }
    for (let k = 0; k < 9; k++) { dv.setFloat32(o, P[t * 9 + k], true); o += 4; }
    o += 2;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([buf], { type: 'model/stl' }));
  a.download = fname + '.stl';
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- inputs ---------- */
function loadSrc(src) {
  const i = new Image();
  i.onload = () => { img = i; build(); };
  i.onerror = () => { $('msg').style.display = 'flex'; $('msg').textContent = 'เปิดไฟล์นี้ไม่ได้ ลองใช้ไฟล์ PNG อื่น'; };
  i.src = src;
}
$('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  fname = f.name.replace(/\.[^.]+$/, '') || 'model';
  loadSrc(URL.createObjectURL(f));
});
$('demo').addEventListener('click', () => {
  const c = document.createElement('canvas'); c.width = c.height = 300;
  const x = c.getContext('2d'); x.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 ? 62 : 140, a = -Math.PI / 2 + i * Math.PI / 5;
    x[i ? 'lineTo' : 'moveTo'](150 + r * Math.cos(a), 156 + r * Math.sin(a));
  }
  x.closePath(); x.moveTo(190, 156); x.arc(150, 156, 40, 0, 7); x.fill('evenodd');
  fname = 'star';
  loadSrc(c.toDataURL());
});
['wd', 'th', 'res', 'thr', 'inv'].forEach(id => $(id).addEventListener('input', build));
$('dl').addEventListener('click', downloadSTL);
$('wdo').textContent = '60 มม.'; $('tho').textContent = '4 มม.'; $('reso').textContent = '120 px'; $('thro').textContent = '128';
resize();
</script>
</body>
</html>
